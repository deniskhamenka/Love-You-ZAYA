<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Love Me Valentine 💝</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background: linear-gradient(135deg, #ff6b9d 0%, #ff8fab 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        .title {
            font-size: clamp(2rem, 8vw, 3.5rem);
            font-weight: 800;
            margin-bottom: 2rem;
            text-align: center;
            padding: 0 1rem;
        }

        .title .love {
            color: #a8e063;
        }

        .title .me {
            color: #ffffff;
        }

        .title .valentine {
            color: #ffffff;
        }

        .question-container {
            background: white;
            border-radius: 30px;
            padding: clamp(2rem, 6vw, 4rem) clamp(2rem, 5vw, 3rem);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
            position: relative;
            max-width: 90%;
            width: 500px;
            animation: slideIn 0.8s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .photo-container {
            margin-bottom: 2rem;
        }

        .main-photo {
            width: 100%;
            max-width: 400px;
            height: auto;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .question {
            font-size: clamp(1.5rem, 5vw, 2rem);
            font-weight: 800;
            color: #333;
            margin-bottom: 2rem;
        }

        .button-container {
            display: flex;
            gap: 1rem;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            min-height: 80px;
            position: relative;
        }

        .btn {
            border: none;
            border-radius: 50px;
            font-family: 'Nunito', sans-serif;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            font-size: clamp(1rem, 4vw, 1.3rem);
            padding: 0.8rem 2rem;
            min-width: 100px;
        }

        .btn:active {
            transform: scale(0.95);
        }

        #yesBtn {
            background: linear-gradient(135deg, #ff6b9d 0%, #ff8fab 100%);
            color: white;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        #yesBtn:hover {
            background: linear-gradient(135deg, #ff5a8c 0%, #ff7a9a 100%);
            box-shadow: 0 6px 20px rgba(255, 107, 157, 0.4);
        }

        #noBtn {
            background: linear-gradient(135deg, #a8a8a8 0%, #c0c0c0 100%);
            color: white;
            position: absolute;
        }

        #noBtn:hover {
            background: linear-gradient(135deg, #989898 0%, #b0b0b0 100%);
        }

        .success-screen {
            display: none;
            text-align: center;
            animation: successFadeIn 1s ease-out;
            background: white;
            border-radius: 30px;
            padding: clamp(2rem, 6vw, 4rem) clamp(2rem, 5vw, 3rem);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 90%;
            width: 500px;
        }

        .warning-text {
            margin-top: 1.5rem;
            font-size: clamp(0.9rem, 3.5vw, 1.1rem);
            font-weight: 800;
            color: #ff6b9d;
            letter-spacing: 1px;
        }

        @keyframes successFadeIn {
            from {
                opacity: 0;
                transform: scale(0.8);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .success-screen h1 {
            font-size: clamp(2rem, 7vw, 3.5rem);
            color: #ff6b9d;
            margin-bottom: 1rem;
            animation: bounce 1s ease-in-out;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-30px); }
            60% { transform: translateY(-15px); }
        }

        .success-screen p {
            font-size: clamp(1.2rem, 4vw, 1.8rem);
            color: #333;
            font-weight: 700;
        }

        .celebration-video {
            margin-top: 2rem;
            max-width: 100%;
            width: 400px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .heart {
            position: absolute;
            font-size: 30px;
            animation: floatHearts 4s ease-in-out infinite;
            opacity: 0;
            pointer-events: none;
        }

        @keyframes floatHearts {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100vh) rotate(360deg);
                opacity: 0;
            }
        }

        /* Mobile adjustments */
        @media (max-width: 600px) {
            .question-container {
                padding: 2rem 1.5rem;
            }
            
            .btn {
                min-width: 80px;
                padding: 0.7rem 1.5rem;
            }
        }
    </style>
</head>
<body>
<div class="question-container" id="questionContainer">
        <div class="photo-container">
            <img src="photo.jpg" alt="Photo" class="main-photo">
        </div>

        <div class="question">ZAYA will you be my valentine?</div>

        <div class="button-container" id="buttonContainer">
            <button class="btn" id="yesBtn">Yes</button>
            <button class="btn" id="noBtn">No</button>
        </div>

        <div class="warning-text">DO NOT EVEN TRY TO CLICK NO</div>
    </div>

    <div class="success-screen" id="successScreen">
        <h1>I KNEW IT! 💕</h1>
        <p>Love you too ❤️❤️❤️</p>
        <video autoplay loop muted playsinline class="celebration-video">
            <source src="celebration.mp4" type="video/mp4">
        </video>
    </div>

    <script>
        const yesBtn = document.getElementById('yesBtn');
        const noBtn = document.getElementById('noBtn');
        const questionContainer = document.getElementById('questionContainer');
        const successScreen = document.getElementById('successScreen');
        const buttonContainer = document.getElementById('buttonContainer');
        
        let attemptCount = 0;

        function getRandomPosition() {
            const container = buttonContainer.getBoundingClientRect();
            const btnRect = noBtn.getBoundingClientRect();
            
            const maxX = container.width - btnRect.width - 20;
            const maxY = container.height - btnRect.height - 20;
            
            const x = Math.random() * maxX;
            const y = Math.random() * maxY;
            
            return { x, y };
        }

        function moveNoButton() {
            attemptCount++;
            
            const pos = getRandomPosition();
            noBtn.style.left = pos.x + 'px';
            noBtn.style.top = pos.y + 'px';
        }

        function createHeart() {
            const heart = document.createElement('div');
            heart.className = 'heart';
            heart.textContent = '❤️';
            heart.style.left = Math.random() * 100 + '%';
            heart.style.animationDelay = Math.random() * 2 + 's';
            document.body.appendChild(heart);
            
            setTimeout(() => {
                heart.remove();
            }, 4000);
        }

        // Touch and mouse events for No button
        noBtn.addEventListener('mouseenter', moveNoButton);
        noBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            moveNoButton();
        });
        noBtn.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            moveNoButton();
        });

        yesBtn.addEventListener('click', () => {
            questionContainer.style.display = 'none';
            successScreen.style.display = 'block';
            
            // Create multiple hearts
            for (let i = 0; i < 30; i++) {
                setTimeout(() => createHeart(), i * 100);
            }
        });

        // Initialize No button position
        window.addEventListener('load', () => {
            const container = buttonContainer.getBoundingClientRect();
            noBtn.style.left = (container.width - 220) + 'px';
            noBtn.style.top = '0px';
        });
    </script>
</body>
</html>
